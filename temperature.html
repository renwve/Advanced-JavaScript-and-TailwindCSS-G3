<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Converter - Temperature</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="scripts/scripts.js"></script>
</head>
<body id = "temperature">
  <section id = "temperatureSctn">
    <h2>Temperature Converter</h2>

    <section id = "temperatureData">
      <input type = "text" id = "temperatureInput" placeholder = "Enter value or array...">

      <select id="temperatureType">
        <option value="c-f">Celcius to Farenheit</option>
        <option value="f-c">Farenheit to Celcius</option>
      </select>

      <button id="temperatureConvert">Convert</button>
      <p id="temperatureResult"></p>
    </section>
</body>
