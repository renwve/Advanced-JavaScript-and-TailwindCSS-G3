<!--
      ─ ⊹ ⊱ ⊰ ⊹ ─
Program Name: Unit Converter
Author/s: Jinglan Liang, Ren Macatuno
Date: May 30, 2026
Description: Program accepts user input of one or more than one numbers
separated by commas or spaces to convert. Users can choose a conversion
category (weight, distance, and temperature). Users can also choose the
conversion direction (i.e metric to imperial or vice versa). The program
reads the input and separates it into individual numebrs if needed,
validates the values to ensure they are numbers, then based on the
selected tab and conversion direction a formula is applied. The program
processes all entered values one at a time and stores the converted
results in an array. Then, the program displays the converted values in
the results section of the webpage. The output shows both the original
value and its converted equivalent.
      ─ ⊹ ⊱ ⊰ ⊹ ─
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Unit Converter</title>
    <script src="scripts/scripts.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between font-sans">

    <main class="flex-grow flex flex-col items-center justify-center p-6">
        <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl p-8 transform transition-all">
            <h1 class="text-3xl text-center text-gray-800 mb-8">Unit Converter</h1>

            <div class="flex flex-wrap md:flex-nowrap justify-center gap-2 bg-gray-100 rounded-xl mb-8">
                <button id="tab-weight" onclick="switchTab('weight')" class="w-full py-3 px-6 text-sm font-semibold rounded-lg transition-all duration-200 bg-blue-300 text-white shadow-md">
                    Weight
                </button>
                <button id="tab-distance" onclick="switchTab('distance')" class="w-full py-3 px-6 text-sm font-semibold rounded-lg transition-all duration-200 text-gray-600 hover:text-gray-900 hover:bg-gray-200">
                    Distance
                </button>
                <button id="tab-temperature" onclick="switchTab('temperature')" class="w-full py-3 px-6 text-sm font-semibold rounded-lg transition-all duration-200 text-gray-600 hover:text-gray-900 hover:bg-gray-200">
                    Temperature
                </button>
            </div>
            <form id="converter-form">
                
                <div class="flex justify-between items-center mb-4">
                    <label id="input-label" class="block text-sm font-bold text-gray-700">
                        Enter Values (Kilograms to Pounds):
                    </label>
                    <select id="conversion-direction" onchange="updateLabels()" class="text-xs bg-white border border-gray-300 rounded-md py-1 px-2 font-medium text-gray-600 focus:outline-none focus:border-blue-300">
                        <option value="metricToImperial">Metric to Imperial</option>
                        <option value="imperialToMetric">Imperial to Metric</option>
                    </select>
                </div>

                <div class="mb-5">
                    <input type="text" id="user-input" required placeholder="Example: 1, 2, 3, 4, 5..."
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg placeholder-gray-400 text-gray-800 font-medium transition-all">
                </div>

                <button type="submit" class="w-full bg-blue-300 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg hover:shadow-blue-200 transition-all duration-150">
                    Convert Values
                </button>
            </form>

            <div id="result-box" class="mt-6 hidden bg-white border-l-4 border-blue-300 rounded-r-lg p-4 transition-all">
                <span class="block text-xs font-bold text-blue-300">Converted Result:</span>
                <p id="result-text" class="text-lg font-mono font-bold text-gray-800 mt-1"></p>
            </div>
        </div>
    </main>
</body>
</html>
